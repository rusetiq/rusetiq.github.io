
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Images to PDF</title>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        input, button {
            margin: 15px 0;
        }

        button {
            padding: 12px 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Images to PDF</h1>
    <p>Select all your downloaded page images.</p>

    <input type="file" id="images" accept="image/png,image/jpeg" multiple>
    <p id="status">No images selected</p>
    <button id="convert" disabled>Convert to PDF</button>

    <script>
        const input = document.getElementById("images");
        const status = document.getElementById("status");
        const button = document.getElementById("convert");
        let files = [];

        input.addEventListener("change", () => {
            files = Array.from(input.files).sort((a, b) =>
                a.name.localeCompare(b.name, undefined, { numeric: true })
            );

            status.textContent = `${files.length} images selected`;
            button.disabled = files.length === 0;
        });

        button.addEventListener("click", async () => {
            button.disabled = true;

            try {
                const pdf = await PDFLib.PDFDocument.create();

                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    status.textContent = `Processing ${i + 1}/${files.length}: ${file.name}`;

                    const bytes = await file.arrayBuffer();
                    const image = file.type === "image/png"
                        ? await pdf.embedPng(bytes)
                        : await pdf.embedJpg(bytes);

                    const landscape = image.width > image.height;
                    const width = landscape ? 841.89 : 595.28;
                    const height = landscape ? 595.28 : 841.89;

                    const page = pdf.addPage([width, height]);
                    const scale = Math.min(width / image.width, height / image.height);
                    const w = image.width * scale;
                    const h = image.height * scale;

                    page.drawImage(image, {
                        x: (width - w) / 2,
                        y: (height - h) / 2,
                        width: w,
                        height: h
                    });
                }

                status.textContent = "Generating PDF...";

                const pdfBytes = await pdf.save();
                const blob = new Blob([pdfBytes], { type: "application/pdf" });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");

                link.href = url;
                link.download = "combined.pdf";
                link.click();

                setTimeout(() => URL.revokeObjectURL(url), 10000);
                status.textContent = `Done! ${files.length} pages converted.`;
            } catch (error) {
                status.textContent = `Error: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
